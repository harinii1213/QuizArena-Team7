<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizArena - Categories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>QuizArena</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="category.html" class="active">Categories</a>
        <a href="quiz.html">Quiz</a>
        <a href="results.html">Results</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <div class="container">
        <h2>Select a Quiz Category</h2>
        <p>Choose any category and start your quiz.</p>

        <button onclick="selectCategory('web')">
            💻 Web Development
        </button>

        <button onclick="selectCategory('ai')">
            🤖 Artificial Intelligence
        </button>

        <button onclick="selectCategory('database')">
            🗄️ Database
        </button>
    </div>
</main>

<footer>
    <p>© 2026 QuizArena Team 7</p>
</footer>

<script>
function selectCategory(category) {
    localStorage.setItem("category", category);
    window.location.href = "quiz.html";
}
</script>

</body>
</html>
